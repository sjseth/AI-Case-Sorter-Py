[project]
name = "ai-case-sorter"
# Derived from the git tag at build time (hatch-vcs, below) so the packaged
# version and the release tag can never drift apart -- see src/sorter/__init__.py
# for how the running app resolves this without needing .git itself.
dynamic = ["version"]
description ="Cross-platform desktop app that sorts spent brass cartridge casings by headstamp using a camera, an image classifier, and a serial-connected sorting machine."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "GPL-3.0-or-later" }
authors = [{ name = "SJSeth Solutions" }]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: X11 Applications",
    "Environment :: Win32 (MS Windows)",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: GNU General Public License v3 or later (GPLv3+)",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Image Recognition",
]
# Every dependency is pinned exactly; see .github/renovate.json5 for how
# bumps arrive. This ships as an application, not a library others resolve
# against, so exact pins cost nothing in dependency conflicts.
dependencies = [
    "pyserial==3.5",
    "opencv-python-headless==5.0.0.93",
    "numpy==2.5.2",
    "Pillow==12.3.0",
    "requests==2.34.2",
    "msal==1.37.0",
    "platformdirs==4.11.3",
    # PEP 440 parsing/ordering for the updater's version comparison.
    "packaging==26.3",
    # Schema migrations: sorter/data/db.py runs its migration steps through
    # sqlite_utils.Migrations (tracking table `_sqlite_migrations`).
    "sqlite-utils==4.2.1",
    # The UI toolkit. Essentials, not the PySide6 meta-package: the meta adds
    # pyside6-addons (~175 MB of WebEngine/3D/Charts/Multimedia) that nothing
    # uses. QtAds (LGPL-2.1+) is the dock system; it pins the same Essentials
    # build, so the two versions move together.
    "PySide6-Essentials==6.11.1",
    "pyside6-qtads==5.0.0.2",
    # Windows-only: enumerates friendly DirectShow camera names so the Camera
    # settings page can show real device names instead of just "Camera N".
    "pygrabber==0.2; platform_system == 'Windows'",
]

[project.urls]
Homepage = "https://github.com/sjseth/AI-Case-Sorter-Py"
Repository = "https://github.com/sjseth/AI-Case-Sorter-Py"
Issues = "https://github.com/sjseth/AI-Case-Sorter-Py/issues"

[project.optional-dependencies]
# Local PyTorch training/inference. Install with `pip install .[ml]`.
# This is the single authoritative pin: sorter/ui/dialog_install_torch.py
# reads it at runtime (that dialog is how PyTorch actually reaches a user's
# venv), so bumping it here is the whole bump — and it keeps the versions
# users really run visible to Renovate and vulnerability scanning, which a
# constant in a .py file never was. One coupling to check when bumping: the
# GPU build installs from a fixed CUDA index (_CUDA_INDEX in that dialog),
# and each index only carries the torch versions built for it —
# tests/integration/test_torch_wheel_index.py verifies the pair resolves.
ml = ["torch==2.13.0", "torchvision==0.28.0"]

[build-system]
requires = ["hatchling==1.32.0", "hatch-vcs==0.5.0"]
build-backend = "hatchling.build"

# Version comes from the git tag at build time -- only ever meaningful when
# .git is actually present (CI, a real clone). fallback-version keeps a
# git-less build (an extracted release archive with no .git) from hard
# erroring; bootstrap.py's `--no-install-project`/`--no-sync` flags exist
# specifically so this hook never runs at all for an end user, since running
# it with no .git would silently overwrite a correctly pre-baked
# src/sorter/_version.py with this fallback -- verified that failure mode
# directly before choosing this design; see bootstrap.py's docstring.
[tool.hatch.version]
source = "vcs"
fallback-version = "0.0.0"

[tool.hatch.version.raw-options]
local_scheme = "no-local-version"

[tool.hatch.build.hooks.vcs]
version-file = "src/sorter/_version.py"

# The one piece of the release archive that is not a copy of the source tree.
# See src/sorter/_legacy_entry.py: an install predating the src/ layout ends
# the launch that applies this update with `python main.py`, so the archive
# has to carry one even though this tree does not. Additive only -- verified
# against a real `uv build` that it does not narrow the sdist's default
# every-tracked-file selection, which tests/integration/test_sdist_contents.py
# depends on.
[tool.hatch.build.targets.sdist.force-include]
"src/sorter/_legacy_entry.py" = "main.py"

[tool.hatch.build.targets.wheel]
packages = ["src/sorter"]

[tool.ruff]
line-length = 120
target-version = "py312"
extend-exclude = ["build", "dist"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "F",   # pyflakes
    "W",   # pycodestyle warnings
    "I",   # isort
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "G",   # flake8-logging-format -- one way to write a log call: `%`-style, lazily formatted
    "LOG", # flake8-logging -- the correctness rules (`logging.WARN`, `.exception(exc_info=False)`, …)
    "RUF100",  # unused `noqa` -- a suppression that outlives its finding reads as a live one
]
ignore = [
    "E501",  # line length is enforced by the formatter, not the linter
]
# Findings are pinned per-file below rather than switched off repo-wide: scoped
# like this the rest of the tree keeps the check, so a *new* occurrence still
# fails CI instead of landing silently. The batch the tool-adoption PR deferred
# (B904, B007, F841) has since been fixed and removed from the table; what is
# left is kept on purpose, each with its reason.
#
# Pinned per-file rather than disabled repo-wide, which is what they were
# first written as. B023 (closure doesn't bind the loop variable) -- since
# cleared, which is this table working as intended -- and F841 are bug
# classes, not style: switched off globally they'd also silence every
# *new* occurrence anywhere in the tree, which is the opposite of "deferred" --
# it's "permanently invisible". Scoped like this the deferral stays honest, the
# rest of the codebase keeps the check, and the list shrinks visibly as the
# follow-up lands. Ruff errors on a per-file-ignore whose file no longer trips
# the rule only under --extend-select preview settings, so re-check with
# `ruff check --select ...` when clearing one out.
# Ruff never flags a per-file-ignore whose file no longer trips the rule, so a
# stale entry here is invisible -- no mode of the linter reports one. When
# clearing one out, re-check with
# `ruff check --isolated --target-version py312 --select ...`: --isolated
# bypasses this table, and --target-version puts back the one setting it
# discards that matters here. Without it, version-gated rules (UP042) report a
# false pass and the entry looks stale when it is still live.

[tool.ruff.lint.per-file-ignores]
# Must run on whatever ancient interpreter the user's system provides, since
# its job is to provision a newer one. pyupgrade rewrites would silently
# break it on exactly the systems it exists to serve. Preventive, not deferred:
# the file is clean today, and this entry is what keeps it that way.
"bootstrap.py" = ["UP"]
# Contains an embedded HTML/JS template as a verbatim port of the legacy
# WinForms app's report (see CLAUDE.md). Whitespace inside that string is
# part of the port; don't rewrite it.
"src/sorter/ml/eval_report.py" = ["W291", "W293"]

# --- deferred pre-existing findings (see the note above [tool.ruff.lint]) ---
"src/sorter/community/community_api.py" = ["B904"]  # raise without `from` in except
"src/sorter/ml/evaluator.py" = ["B007"]              # unused loop control variable
"src/sorter/ml/local_inference.py" = ["F841"]        # unused local
# --- kept on purpose (see the note above [tool.ruff.lint]) ---
"src/sorter/hardware/camera.py" = ["B023"]          # backend-probe closures
"src/sorter/data/model_io.py" = ["UP042"]                # str+Enum -> StrEnum changes behavior subtly
"tests/unit/data/test_db.py" = ["B017"]             # assert-raises-Exception, deliberate here

[tool.ruff.lint.isort]
known-first-party = ["sorter"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --cov=sorter --cov-report=term"
# Generous: the slowest legitimate tests spawn real training subprocesses.
timeout = 120
markers = [
    "integration: exercises a real external tool or service (uv build, git-cliff, the PyTorch wheel index) instead of a synthetic fixture",
]
# The suite is threading-fragile by design: real worker threads, real
# subprocesses and real Qt widget trees. Do not add pytest-xdist or any plugin
# that parallelizes or reorders test execution.

[dependency-groups]
dev = [
    "pytest==9.1.1",
    # Hangs become failures with tracebacks: the suite is full of worker
    # round-trips and real subprocesses whose failure mode is silence.
    "pytest-timeout==2.4.0",
    "pytest-cov==7.1.0",
    "ruff==0.16.3",
    "ty==0.0.73",
    # Only tests/unit/test_workflow_permissions.py uses this, and only to read
    # .github/workflows/*.yml. It earns its place because the thing it checks
    # is a *parse* error GitHub raises when a release is dispatched -- there is
    # no earlier signal, actionlint does not flag it, and the alternative is
    # learning about it from a failed release.
    "pyyaml==6.0.3",
]
# The published documentation site (mkdocs.yml, docs/). Its own group, not
# `dev`: nothing in the test loop needs it, and mkdocs-material pulls a dozen
# packages a contributor running pytest has no use for.
docs = [
    "mkdocs-material==9.7.7",
    # Versioned deploys to gh-pages, and the dropdown the Material theme renders
    # from mike's own versions.json (extra.version.provider in mkdocs.yml).
    "mike==2.2.0",
    # One PDF of the whole site per deployed version, linked from the landing
    # page. Env-gated (ENABLE_PDF_EXPORT=1): WeasyPrint needs system pango,
    # which CI installs and a laptop running `mkdocs serve` shouldn't need.
    "mkdocs-with-pdf==0.9.3",
]

[tool.coverage.run]
branch = true
source = ["sorter"]

[tool.coverage.report]
# Optional-dependency guards and Windows-only branches never run on one box.
exclude_also = ["if TYPE_CHECKING:", "raise NotImplementedError"]

# ty (type checker) configuration.
#
# `src/sorter/_version.py` is written by hatch-vcs's build hook and gitignored
# (see src/sorter/__init__.py and CLAUDE.md §7), so whether it exists on disk
# depends purely on whether this tree has ever been built. CI runs with
# --no-install-project so the hook never fires and the file is absent; a
# contributor who has run `uv build` locally has it. That makes the import in
# src/sorter/__init__.py unresolvable in one case and perfectly fine in the
# other -- and a bare `# ty: ignore` would then flip to an *unused* ignore for
# the contributor, failing the build for them and nobody else.
#
# Suppressing unused-ignore-comment for that one file keeps the ignore honest
# in both states while leaving the rule active everywhere else, which is what
# catches ignores that have gone stale.
[[tool.ty.overrides]]
include = ["src/sorter/__init__.py"]

[tool.ty.overrides.rules]
unused-ignore-comment = "ignore"
