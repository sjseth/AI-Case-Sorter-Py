name: Lint

on:
  push:
    branches: [main]
  pull_request:
  # Callable so release.yml can gate a release on the same checks that
  # guard main, rather than reimplementing them.
  workflow_call:
  # Manual runs: the release-config job pins git-cliff's version mapping, which
  # can drift when that tool is upgraded rather than when this repo changes --
  # so it needs to be runnable without a commit to hang it on.
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # The deploy job builds strictly too, but that is the wrong place to learn
  # about a dead link: it runs at release time, and now also on every push to
  # main for the dev slot. Failing here fails the PR that broke it.
  docs:
    name: mkdocs (strict build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          python-version: "3.13"
          enable-cache: true

      - name: Install the docs toolchain
        run: uv sync --locked --only-group docs --no-install-project

      # The PLAIN config, matching the deploy job's pre-flight: the PDF
      # plugin's WeasyPrint warnings count as errors under --strict even when
      # the PDF renders, and links and anchors are identical in both configs.
      - name: Build the site strictly
        run: uv run --no-sync mkdocs build --strict

  ruff:
    name: ruff (check + format)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          python-version: "3.13"
          enable-cache: true

      # From uv.lock, so a new ruff release can't turn open PRs red on its
      # own. --no-install-project: building would fire hatch-vcs's hook,
      # which needs tags this checkout lacks.
      - name: Install ruff from the lockfile
        run: uv sync --locked --only-group dev --no-install-project

      - name: ruff check
        run: uv run --no-sync ruff check .

      - name: ruff format --check
        run: uv run --no-sync ruff format --check .

  # Blocking. The tree is at zero diagnostics, so any finding here is one this
  # PR introduced -- there is no backlog left to hide in.
  ty:
    name: ty (type check)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          python-version: "3.13"
          enable-cache: true

      # Full dependency sync (not --only-group dev): ty resolves third-party
      # imports from the environment, so without the runtime deps installed the
      # output drowns in unresolved-import noise. --no-install-project: building
      # would fire hatch-vcs's hook, which needs tags this checkout lacks.
      - name: Install dependencies from the lockfile
        run: uv sync --locked --no-install-project

      - name: ty check
        run: uv run --no-sync ty check --output-format github

  workflows:
    name: lint the workflows themselves
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Digest-pinned: a release asset is mutable upstream.
      - name: Install actionlint
        env:
          ACTIONLINT_VERSION: "1.7.7"
          ACTIONLINT_SHA256: "023070a287cd8cccd71515fedc843f1985bf96c436b7effaecce67290e7e0757"
        run: |
          curl -fsSL -o actionlint.tar.gz \
            "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          echo "${ACTIONLINT_SHA256}  actionlint.tar.gz" | sha256sum -c -
          tar -xzf actionlint.tar.gz actionlint
          sudo mv actionlint /usr/local/bin/
          rm actionlint.tar.gz

      - name: actionlint
        run: actionlint .github/workflows/*.yml

      # Pinned: an unpinned linter can fail a PR that changed nothing.
      - name: Install zizmor
        run: pip install zizmor==1.29.0

      - name: zizmor
        run: zizmor --min-severity medium .github/workflows/ .github/actions/

      - name: Install yamllint
        run: pip install yamllint==1.38.0

      - name: yamllint
        run: |
          yamllint -d "{extends: relaxed, rules: {line-length: {max: 200}}}" \
            .github/workflows/ .github/actions/

  # cliff.toml decides the released version, so a wrong answer here ships a
  # wrong release. The test skips without git-cliff, hence a job that installs it.
  release-config:
    name: release version mapping
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          python-version: "3.13"
          enable-cache: true

      # Same build the release uses -- this job asserts its bump mapping.
      - uses: ./.github/actions/setup-git-cliff

      - name: Install pytest from the lockfile
        run: uv sync --locked --only-group dev --no-install-project

      # Builds throwaway repos; shares no state with the rest of the suite.
      - name: Assert the bump mapping the docs publish
        run: uv run --no-sync pytest tests/integration/test_cliff_config.py -q
