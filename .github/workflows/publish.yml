name: Publish

# No release: trigger any more -- release.yml owns the whole release, including
# tagging, attaching artifacts, verification and publishing. Two workflows both
# firing on release:published is what produced the race this replaced: the
# installer check ran alongside the asset upload rather than after it.
#
# What is left here is the continuous half: build and check the packaging path
# on every push to main, plus a manual escape hatch for publishing an already
# built artifact.
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      target:
        description: "Where to publish (manual runs only)"
        required: false
        type: choice
        options: [testpypi, pypi]
        default: testpypi

permissions:
  contents: read

jobs:
  # Always runs -- on every push to main, not just on a release -- so the
  # packaging path stays continuously exercised even while PyPI publishing
  # itself is switched off below. A build that only gets tried once a
  # release is cut is a build nobody has actually run in weeks by the time
  # it matters.
  package:
    name: Build and check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      # Caching disabled deliberately: this job's output can end up on PyPI
      # (via the publish jobs below), so a cache-poisoning risk here is a
      # supply-chain concern, not just a speed tradeoff -- unlike the routine
      # test matrix in build.yml, which has no publish step downstream.
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          enable-cache: false

      - name: Build
        run: uv build

      - name: Check package metadata
        run: pipx run twine check --strict dist/*

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dist
          path: dist/

  # Manual only. The release path publishes from release.yml, where it is gated
  # on the installer verification; these two exist for the case that needs a
  # human anyway -- re-publishing after a transient index failure, or pushing a
  # build to TestPyPI to look at. Reaching an index still requires approving the
  # `test`/`stable` environment.
  publish-to-testpypi:
    name: Publish to TestPyPI
    needs: package
    if: github.event_name == 'workflow_dispatch' && inputs.target == 'testpypi'
    runs-on: ubuntu-latest
    environment:
      name: test
      url: https://test.pypi.org/p/ai-case-sorter
    permissions:
      id-token: write # required for trusted publishing (OIDC) -- no API token stored
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dist
          path: dist/

      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with:
          repository-url: https://test.pypi.org/legacy/
          skip-existing: true

  publish-to-pypi:
    name: Publish to PyPI
    needs: package
    if: github.event_name == 'workflow_dispatch' && inputs.target == 'pypi'
    runs-on: ubuntu-latest
    environment:
      name: stable
      url: https://pypi.org/p/ai-case-sorter
    permissions:
      id-token: write # required for trusted publishing (OIDC) -- no API token stored
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dist
          path: dist/

      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with:
          skip-existing: true
