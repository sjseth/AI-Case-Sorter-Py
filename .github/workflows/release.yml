name: Release

# The whole release, start to finish, in one workflow.
#
# Previously this stopped at "draft release created" and publish.yml took over
# on release:published. That split had two problems. Everything that verified
# the release ran *after* it was public -- so a failure meant a bad release was
# already live and already visible to every updater polling /releases/latest.
# And publish.yml attached the sdist after publication, leaving a window (26
# seconds, measured on 1.0.0) where the release existed with no matching asset
# and clients silently fell back to the source archive.
#
# The shape that fixes both is to make the release *invisible* until it has been
# verified:
#
#   prepare  ->  checks  ->  [approval]  ->  release (prerelease + assets)
#                                              ->  verify installer
#                                              ->  promote to latest
#                                              ->  TestPyPI  ->  PyPI
#
# A prerelease is the key. It is publicly readable by exact tag, so the
# installer can be run against it for real, but /releases/latest excludes it --
# so updater.py and a default installer run cannot see it. If verification
# fails, nothing was ever served: no user saw the release, and PyPI (the one
# irreversible step) never ran.
#
# No draft anywhere. A draft would be invisible to the verification too --
# /releases/tags/<tag> 404s for the unauthenticated fetch the installer does --
# which is exactly why the release is a prerelease and not a draft.
#
# Publishing an actual release candidate then costs one thing: not taking the
# promote step. The `prerelease` input stops there, so an rc is a normal
# release that was built, asserted and installer-verified exactly like any
# other -- it just never becomes /releases/latest. Testers reach it through
# the update dialog's version picker ("Show prereleases").

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release (PEP 440, no v prefix), e.g. 0.2.0. Leave empty to auto-detect from Conventional Commits."
        required: false
        type: string
      prerelease:
        description: "Publish as a release candidate instead of a release: verified like any release, but never promoted to latest. The number is chosen for you (0.5.0 -> 0.5.0rc1, then rc2)."
        required: false
        type: choice
        options: [none, rc, b, a]
        default: none
      ref:
        description: "Branch, tag, or commit SHA to release from. Leave empty for the branch this workflow was dispatched on."
        required: false
        type: string
      force:
        description: "Allow a version that disagrees with the auto-detected one."
        required: false
        type: boolean
        default: false
      dry-run:
        description: "Validate and preview only -- no checks run, no tag pushed, nothing published."
        required: false
        type: boolean
        default: true

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  # Resolves what would be released and writes the summary. Deliberately does
  # nothing durable: a dry run is exactly this job and nothing else, so the
  # preview costs one cheap job rather than a full pipeline.
  prepare:
    name: resolve version and notes
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.resolve.outputs.version }}
      auto: ${{ steps.resolve.outputs.auto }}
      source: ${{ steps.resolve.outputs.source }}
      previous: ${{ steps.previous.outputs.tag }}
      prerelease: ${{ steps.resolve.outputs.prerelease }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
          fetch-tags: true
          ref: ${{ inputs.ref || github.ref }}

      - uses: ./.github/actions/setup-git-cliff

      - uses: ./.github/actions/check-version
        with:
          version: ${{ inputs.version }}

      # Captured before the release job creates the new tag -- a lookup run
      # after that would find the just-created tag instead.
      #
      # Selects tags as git-cliff does, so this names the boundary the notes
      # came from: cliff.toml's tag_pattern, and no `--merged` because
      # git-cliff does not require an ancestor of HEAD.
      - name: Record previous tag
        id: previous
        run: |
          PREV="$(git tag --list --sort=-version:refname | grep -E '^[0-9]+\.[0-9]+\.[0-9]+$' | head -1)"
          echo "tag=$PREV" >> "$GITHUB_OUTPUT"

      - name: Resolve version
        id: resolve
        env:
          REQUESTED: ${{ inputs.version }}
          FORCE: ${{ inputs.force }}
          KIND: ${{ inputs.prerelease }}
        run: |
          AUTO="$(git-cliff --config cliff.toml --bumped-version)"

          # The force check compares the *base*, not the suffixed version:
          # git-cliff never proposes an rc, so the latter would demand `force`
          # for every candidate.
          if [ -z "$REQUESTED" ]; then
            BASE="$AUTO"
            SOURCE="auto-detected from Conventional Commits"
          else
            # Already validated by check-version above.
            BASE="$REQUESTED"
            if [ "$BASE" != "$AUTO" ]; then
              if [ "$FORCE" != "true" ]; then
                echo "::error::Version '$BASE' disagrees with the auto-detected '$AUTO'. Re-run with force enabled if that is deliberate."
                exit 1
              fi
              echo "::warning::Forcing '$BASE' over the auto-detected '$AUTO'."
              SOURCE="user-specified (forced over '$AUTO')"
            else
              SOURCE="user-specified (matches auto-detected)"
            fi
          fi

          # Auto-detect can legitimately return nothing useful -- e.g. a repo
          # with no tags *and* no conventional commits to infer a bump from.
          # Better to fail here than to try tagging an empty string.
          if [ -z "$BASE" ]; then
            echo "::error::Could not determine a version to release. Pass one explicitly."
            exit 1
          fi

          VERSION="$BASE"
          if [ "$KIND" != "none" ] && [ -n "$KIND" ]; then
            # A version typed with its own segment is taken at face value --
            # re-suffixing 0.5.0rc1 would produce nonsense.
            if echo "$BASE" | grep -qE '(a|b|rc)[0-9]+$'; then
              echo "::warning::'$BASE' already names a prerelease; using it as given rather than appending '$KIND'."
            else
              VERSION="$(.github/scripts/next-prerelease.sh "$BASE" "$KIND")"
              SOURCE="$SOURCE, as $KIND"
            fi
          fi

          # Read off the resolved version, not the input, so a hand-typed
          # 0.5.0rc1 is treated as the prerelease it is.
          if echo "$VERSION" | grep -qE '(a|b|rc)[0-9]+$'; then
            PRERELEASE=true
          else
            PRERELEASE=false
          fi

          {
            echo "version=$VERSION"
            echo "auto=$AUTO"
            echo "source=$SOURCE"
            echo "prerelease=$PRERELEASE"
          } >> "$GITHUB_OUTPUT"

      # The input is validated above; this validates what was *computed* from
      # it, which until now nothing did.
      - uses: ./.github/actions/check-version
        with:
          version: ${{ steps.resolve.outputs.version }}

      # Also enforced in check-release.yml: this prevents before tagging, that
      # catches a release made by hand in the UI.
      - uses: ./.github/actions/check-release-branch
        with:
          ref: ${{ inputs.ref || github.ref }}

      - name: Check tag does not already exist
        env:
          VERSION: ${{ steps.resolve.outputs.version }}
        run: |
          if git rev-parse "$VERSION" > /dev/null 2>&1; then
            echo "::error::Tag '$VERSION' already exists"
            exit 1
          fi

      - name: Generate changelog
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: git-cliff --config cliff.toml --latest --unreleased --strip all --output NOTES.md

      # Handed to the release job rather than regenerated there: the notes the
      # reviewer approved are then provably the notes that ship.
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-notes
          path: NOTES.md

      - name: Summary
        if: always()
        env:
          VERSION: ${{ steps.resolve.outputs.version }}
          AUTO: ${{ steps.resolve.outputs.auto }}
          SOURCE: ${{ steps.resolve.outputs.source }}
          REF: ${{ inputs.ref || github.ref }}
          DRY_RUN: ${{ inputs.dry-run }}
          LATEST: ${{ steps.previous.outputs.tag }}
          PRERELEASE: ${{ steps.resolve.outputs.prerelease }}
        run: |
          if [ "$PRERELEASE" = "true" ]; then
            FINISH="tag + prerelease + verify, then STOP -- not promoted to latest, no PyPI"
          else
            FINISH="tag + prerelease + verify + promote to latest + publish"
          fi
          # Test the value: "false" is non-empty, so ${DRY_RUN:+...} would
          # expand for both.
          if [ "$DRY_RUN" = "true" ]; then
            HEADING="Release (dry run)"
            MODE="dry run -- nothing tagged, nothing published"
          else
            HEADING="Release"
            MODE="awaiting approval, then $FINISH"
          fi
          {
            echo "### $HEADING"
            echo ""
            echo "| | Value |"
            echo "|---|---|"
            echo "| Version | \`$VERSION\` |"
            echo "| Auto-detected | \`$AUTO\` |"
            echo "| Source | $SOURCE |"
            echo "| Ref | \`$REF\` |"
            echo "| Previous tag | \`${LATEST:-(none yet)}\` |"
            echo "| Mode | $MODE |"
            echo ""
            echo "#### Release notes"
            echo ""
            cat NOTES.md 2>/dev/null || echo "_(not generated -- an earlier step failed)_"
            echo ""
            # Anything here but missing above was dropped as unconventional
            # or as a skipped ci:/build: type.
            echo "<details><summary>Commits since \`${LATEST:-the beginning}\`</summary>"
            echo ""
            if [ -n "$LATEST" ]; then
              git log "${LATEST}..HEAD" --format="- %h %s"
            else
              git log --format="- %h %s" | head -40
            fi
            echo ""
            echo "</details>"
          } >> "$GITHUB_STEP_SUMMARY"

  # The same checks that guard main, called rather than reimplemented, and run
  # *before* the approval gate so the reviewer is approving something already
  # green rather than a version string.
  lint:
    name: checks
    needs: prepare
    if: ${{ !inputs.dry-run }}
    uses: ./.github/workflows/lint.yml
    permissions:
      contents: read

  test:
    name: checks
    needs: prepare
    if: ${{ !inputs.dry-run }}
    uses: ./.github/workflows/build.yml
    permissions:
      contents: read

  # THE APPROVAL GATE. `environment: stable` is what makes this job sit pending
  # until a required reviewer approves it -- that is the in-flow confirmation,
  # and by this point the summary above shows the version, the notes and a
  # green check run.
  #
  # Environment protection rules are free on public repositories; the paid tier
  # applies to private ones only.
  release:
    name: tag and create the prerelease
    needs: [prepare, lint, test]
    if: ${{ !inputs.dry-run }}
    runs-on: ubuntu-latest
    environment:
      name: stable
      url: ${{ steps.create.outputs.url }}
    permissions:
      contents: write
    outputs:
      version: ${{ needs.prepare.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
          fetch-tags: true
          ref: ${{ inputs.ref || github.ref }}

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-notes

      # Caching disabled deliberately: this job's output can end up on PyPI, so
      # a cache-poisoning risk here is a supply-chain concern, not just a speed
      # tradeoff -- unlike the routine test matrix, which has no publish step
      # downstream.
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          enable-cache: false

      # Tagged locally first, and pushed only once the artifacts built from it
      # have been checked. hatch-vcs derives the version from `git describe`, so
      # the tag has to exist before the build for the artifact to carry the
      # right version -- but nothing is published to the world until the checks
      # below pass.
      - name: Create the tag locally
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag "$VERSION"

      - name: Build
        run: uv build

      # hatch-vcs reads the tag back from git rather than trusting the input;
      # this catches them disagreeing, e.g. a dirty working tree making
      # hatch-vcs append .devN+dirty to an otherwise-correct tag.
      - name: Assert the built version matches the tag
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          # Path tracks `version-file` in pyproject.toml's [tool.hatch.build.hooks.vcs].
          # `head -1` keeps the exit status at 0 when the file is missing, so the
          # error below is what a reader sees rather than a bare `set -e` abort.
          BUILT="$(grep -hoP "(?<=^__version__ = version = ')[^']+" src/sorter/_version.py 2>/dev/null | head -1)"
          if [ "$BUILT" != "$VERSION" ]; then
            echo "::error::Built version '${BUILT:-<src/sorter/_version.py not found>}' does not match '$VERSION' -- refusing to release."
            exit 1
          fi

      # The updater matches this filename exactly (updater._expected_asset_name)
      # and silently falls back to the source archive when it misses -- losing
      # the baked-in version the sdist exists to deliver. hatchling normalizes
      # the version per PEP 440, so a tag like 1.2.3-rc1 builds as 1.2.3rc1 and
      # would never match.
      #
      # Checked inside the artifact, not the workspace: that proves the file the
      # updater downloads actually carries the version, rather than just proving
      # hatch-vcs ran.
      - name: Assert the sdist is named and stamped as the updater expects
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          SDIST="dist/ai_case_sorter-${VERSION#v}.tar.gz"
          if [ ! -f "$SDIST" ]; then
            echo "::error::Expected $SDIST; built $(ls dist/*.tar.gz). The updater matches by exact name and would fall back to the source archive."
            exit 1
          fi
          if ! tar -tzf "$SDIST" | grep -qE '(^|/)sorter/_version\.py$'; then
            echo "::error::$SDIST does not contain sorter/_version.py -- an install from it would report 0.0.0+unknown."
            exit 1
          fi

      - name: Check package metadata
        run: pipx run twine check --strict dist/*

      # persist-credentials: false means `origin` has no auth; push to an
      # explicit tokenised URL rather than leaving one in .git/config.
      - name: Push the tag
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: git push "https://x-access-token:${GH_TOKEN}@github.com/${REPO}.git" "$VERSION"

      # --prerelease is what keeps this invisible until verified: publicly
      # readable by exact tag, so the installer can be run against it, but
      # excluded from /releases/latest, so no updater and no default installer
      # run can reach it yet.
      #
      # Assets are passed to `create` rather than uploaded afterwards, so the
      # release never exists in a state where its sdist is missing.
      - name: Create the prerelease with its artifacts
        id: create
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ needs.prepare.outputs.version }}
          PRERELEASE: ${{ needs.prepare.outputs.prerelease }}
        run: |
          URL=$(gh release create "$VERSION" \
            --title "$VERSION" \
            --notes-file NOTES.md \
            --prerelease \
            dist/*)
          echo "url=$URL" >> "$GITHUB_OUTPUT"
          {
            echo "### Prerelease created"
            echo ""
            echo "\`$VERSION\` -- $URL"
            echo ""
            echo "Not visible to updaters: \`/releases/latest\` excludes prereleases."
            if [ "$PRERELEASE" = "true" ]; then
              echo "This is a release candidate, so it stays that way -- it is verified below but never promoted."
            else
              echo "It is promoted only if the installer verification below passes."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dist
          path: dist/

  # Installs the release for real, on Windows, from the assets just attached --
  # pinned to this tag, since /releases/latest would resolve to the *previous*
  # release while this one is still a prerelease.
  verify-installer:
    name: verify
    needs: [prepare, release]
    uses: ./.github/workflows/installer-smoke.yml
    permissions:
      contents: read
    with:
      tag: ${{ needs.prepare.outputs.version }}

  # The moment the release becomes real. One flag flip, with the assets already
  # in place -- so there is no window where /releases/latest returns a release
  # whose sdist has not landed yet.
  #
  # A release candidate skips the flip and nothing else. Gated per *step*, not
  # by skipping the job: a skipped job cascades through `needs: promote` and
  # would take TestPyPI with it.
  promote:
    name: promote to latest
    needs: [prepare, verify-installer]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Promote the prerelease
        if: ${{ needs.prepare.outputs.prerelease != 'true' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ needs.prepare.outputs.version }}
          REPO: ${{ github.repository }}
        run: |
          gh release edit "$VERSION" --repo "$REPO" --prerelease=false --latest
          {
            echo "### Released"
            echo ""
            echo "\`$VERSION\` is now the latest release. Updaters will pick it up."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Leave it as a prerelease
        if: ${{ needs.prepare.outputs.prerelease == 'true' }}
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          {
            echo "### Release candidate published"
            echo ""
            echo "\`$VERSION\` stays a prerelease. \`/releases/latest\` is unchanged, so no"
            echo "existing install is offered it by the startup check."
            echo ""
            echo "To install it:"
            echo ""
            echo "- **In the app** -- \"Check for updates\" -> \"Choose a different version…\" -> tick \"Show prereleases\"."
            echo "- **Fresh Windows install** -- \`install-windows.ps1 -Version $VERSION\`."
            echo ""
            echo "Cut the real release by running this workflow again with \`prerelease: none\`."
          } >> "$GITHUB_STEP_SUMMARY"

  # The documentation site, versioned per release. Called here rather than
  # triggered on release:published for the same reason verify-installer is:
  # that event fires while this is still a prerelease, so the docs would move
  # their `latest` alias for a release candidate that never becomes latest.
  # docs.yml reads the version and decides -- an rc is published under its own
  # number and nothing else moves.
  #
  # Runs after promote and independently of the PyPI jobs: a docs failure must
  # not hold up (or be held up by) publishing.
  #
  # This block has to mirror docs.yml's `deploy` job permissions exactly, not
  # just cover what this workflow needs: a called workflow's token is capped at
  # what the calling job grants, and requesting more is a *parse* error -- the
  # whole of release.yml is rejected as an invalid workflow file, before any
  # job runs, with "the nested job 'deploy' is requesting 'pages: write', but
  # is only allowed 'pages: none'". actionlint does not catch it;
  # tests/unit/test_workflow_permissions.py does. `contents: write` is mike
  # pushing to gh-pages, `pages: write` the one-time Pages enablement call at
  # the end of that job.
  docs:
    name: publish the documentation site
    needs: [prepare, promote]
    uses: ./.github/workflows/docs.yml
    permissions:
      contents: write
      pages: write
    with:
      version: ${{ needs.prepare.outputs.version }}

  # Gated behind a repo variable, unset = off, so this changes nothing until a
  # maintainer deliberately opts in (Settings -> Actions -> Variables ->
  # PYPI_PUBLISH_ENABLED = true).
  publish-to-testpypi:
    name: publish to TestPyPI
    needs: promote
    if: vars.PYPI_PUBLISH_ENABLED == 'true'
    runs-on: ubuntu-latest
    environment:
      name: test
      url: https://test.pypi.org/p/ai-case-sorter
    permissions:
      id-token: write # required for trusted publishing (OIDC) -- no API token stored
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dist
          path: dist/

      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with:
          repository-url: https://test.pypi.org/legacy/
          skip-existing: true

  # Last, because it is the only step that cannot be undone: a PyPI version can
  # be yanked but never replaced. Everything before it -- the tag, the release,
  # even the promotion -- can be deleted and redone. A release candidate
  # therefore stops at TestPyPI; pip needs --pre to see a prerelease anyway.
  publish-to-pypi:
    name: publish to PyPI
    needs: [prepare, promote, publish-to-testpypi]
    if: vars.PYPI_PUBLISH_ENABLED == 'true' && needs.prepare.outputs.prerelease != 'true'
    runs-on: ubuntu-latest
    environment:
      name: stable
      url: https://pypi.org/p/ai-case-sorter
    permissions:
      id-token: write # required for trusted publishing (OIDC) -- no API token stored
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dist
          path: dist/

      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with:
          skip-existing: true
