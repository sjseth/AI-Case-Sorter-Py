name: Build

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: pytest (${{ matrix.os }}, py${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    continue-on-error: ${{ matrix.python-version == '3.14' }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          python-version: ${{ matrix.python-version }}
          enable-cache: true

      # libgl1/libglib2.0-0 only -- not python3-tk. uv's provisioned Python
      # bundles Tcl/Tk itself (verified empirically on real runners), so
      # the system Python running this step no longer needs it either; only
      # the graphics libraries opencv dlopens at runtime are still a real gap.
      - name: Install system dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgl1 libglib2.0-0 xvfb

      # --locked (not bootstrap.py's --frozen): CI's job is exactly to catch
      # a uv.lock that's drifted from pyproject.toml, so it should fail loud
      # here rather than silently pass with a stale lock.
      - name: Sync dependencies
        run: uv sync --locked --python ${{ matrix.python-version }}

      # opencv-python's cp314 wheels aren't reliably published yet; a resolution
      # failure here is expected until they land, hence continue-on-error above
      # rather than a hard skip -- the matrix leg still reports what's true today.

      - name: Run tests (Linux, headless display)
        if: runner.os == 'Linux'
        run: xvfb-run -a uv run --locked --python ${{ matrix.python-version }} pytest -q --junitxml=build/junit.xml

      - name: Run tests (Windows)
        if: runner.os == 'Windows'
        run: uv run --locked --python ${{ matrix.python-version }} pytest -q --junitxml=build/junit.xml

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: junit-${{ matrix.os }}-py${{ matrix.python-version }}
          path: build/junit.xml

  launcher-smoke:
    name: verify launcher bootstrap (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false

      # The version here is just what runs bootstrap.py itself -- bootstrap.py
      # provisions the app's actual interpreter separately via uv, per
      # .python-version. That decoupling is the whole point being tested.
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"

      # xvfb only -- deliberately NOT libgl1/glib. Pre-installing those would
      # test a runner that already has them, not bootstrap.py's own
      # detect-and-offer-to-install logic. xvfb just gives Tk a display to
      # initialize against; it has nothing to do with that logic.
      - name: Install xvfb (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb

      # main.py has no headless flag, so a full run blocks on the Tk main
      # loop and the launcher never exits on its own. So wait for the line
      # bootstrap.py prints when it hands off to the app rather than for the
      # process: everything under test (uv install, dependency sync, the
      # Linux runtime-lib check) has happened by then, and the previous
      # fixed 60x5s loop could only ever end by exhausting all 300 seconds.
      # 300s stays, as a ceiling rather than a floor.
      #
      # Output is redirected and dumped afterward unconditionally, not just on
      # failure. This used to come back empty on every run; the cause was
      # bootstrap.py's stdout being block-buffered once redirected, so a
      # process killed mid-run never flushed a byte. Fixed at the source
      # (bootstrap.log's writer flushes), which is also what makes the poll
      # below possible at all.
      - name: Launch and wait (Linux)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          Xvfb :99 -screen 0 1280x1024x24 &
          export DISPLAY=:99
          timeout 300 ./start.sh --auto > bootstrap.log 2>&1 &
          LAUNCH_PID=$!
          READY=0
          for _ in $(seq 1 300); do
            if grep -q 'Starting the app' bootstrap.log 2>/dev/null; then
              READY=1
              break
            fi
            # The launcher exiting before that line means it failed; stop
            # waiting and let the dumped log below show why.
            kill -0 "$LAUNCH_PID" 2>/dev/null || break
            sleep 1
          done
          # Give Tk a moment to initialize, so an immediate crash still lands
          # in the log rather than being killed before it can be printed.
          sleep 10
          kill "$LAUNCH_PID" 2>/dev/null || true
          wait "$LAUNCH_PID" 2>/dev/null || true
          echo "----- bootstrap.py output -----"
          cat bootstrap.log || true
          if [ "$READY" -ne 1 ]; then
            echo "::error::bootstrap.py never reached the app-launch step."
            exit 1
          fi

      # A PowerShell background Job, not Start-Process -RedirectStandardOutput:
      # the previous attempt at this (Start-Process -WindowStyle Hidden +
      # file-redirected output) completed in ~5 seconds with no output in
      # either redirect file and no clear error -- the combination is a known
      # flaky one for launching a .bat this way. Start-Job captures the
      # child's streams natively, no file redirection involved.
      #
      # Same reason as the Linux step for polling rather than waiting: the job
      # never completes on its own, so Wait-Job -Timeout 300 always waited the
      # full five minutes. -Keep leaves the output on the job so the dump
      # below still shows everything.
      - name: Launch and wait (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $job = Start-Job -ScriptBlock {
            Set-Location $using:PWD
            & .\start.bat --auto 2>&1
          }
          $ready = $false
          foreach ($i in 1..300) {
            $sofar = Receive-Job -Job $job -Keep | Out-String
            if ($sofar -match 'Starting the app') { $ready = $true; break }
            if ($job.State -ne 'Running') { break }
            Start-Sleep -Seconds 1
          }
          # Let Tk initialize, so an immediate crash still reaches the log.
          Start-Sleep -Seconds 10
          Write-Host "----- bootstrap.py output (job state: $($job.State)) -----"
          Receive-Job -Job $job -Keep
          Stop-Job -Job $job -ErrorAction SilentlyContinue
          Remove-Job -Job $job -Force -ErrorAction SilentlyContinue
          if (-not $ready) {
            Write-Host "::error::bootstrap.py never reached the app-launch step."
            exit 1
          }

      # The real assertion: not "a file exists" but "the resulting environment
      # actually works". Two separate checks, since `uv run` rejects
      # --frozen and --locked together: --check catches a uv.lock that has
      # drifted from pyproject.toml, and the import proves the environment
      # bootstrap.py actually built -- via `uv sync --frozen`, same as here
      # -- has the runtime pieces that matter (cv2 needs libGL/glib; tkinter
      # needs Tcl/Tk). Works identically on both platforms because
      # bootstrap.py's logic is now the same code either way.
      - name: Verify the resulting environment (Linux)
        if: runner.os == 'Linux'
        run: |
          test -x .uv/bin/uv || { echo "::error::bootstrap.py did not install uv"; exit 1; }
          .uv/bin/uv lock --check
          .uv/bin/uv run --frozen python -c "import cv2, tkinter; print('cv2 + tkinter import OK')"

      - name: Verify the resulting environment (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          if (-not (Test-Path ".uv\bin\uv.exe")) {
            Write-Error "bootstrap.py did not install uv"
            exit 1
          }
          & .uv\bin\uv.exe lock --check
          & .uv\bin\uv.exe run --frozen python -c "import cv2, tkinter; print('cv2 + tkinter import OK')"
