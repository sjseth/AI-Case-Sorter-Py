name: Build

on:
  push:
    branches: [main]
  pull_request:
  # Callable so release.yml can gate a release on the same checks that
  # guard main, rather than reimplementing them.
  workflow_call:
  # Manual runs: re-running the matrix against main without pushing anything,
  # e.g. to check a flake or a newly released Python.
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: pytest (${{ matrix.os }}, py${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    continue-on-error: ${{ matrix.python-version == '3.14' }}
    strategy:
      fail-fast: false
      matrix:
        # macos-latest runs on Apple Silicon: it turns "probably works on
        # macOS" into a fact (#36). It covers the CPU inference path only —
        # Actions offers no MPS guarantee worth relying on.
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.12", "3.13", "3.14"]
    env:
      # Qt's own offscreen platform plugin: no display server, no xvfb, on
      # either OS. tests/unit/ui/conftest.py setdefault's the same value;
      # this makes CI's intent legible.
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # Tags, not just the tip: test_cross_version_update.py checks out the
          # previous release and runs *its* updater against this tree. Without
          # them that test self-skips, and the flat->src upgrade path is
          # covered by nothing.
          fetch-depth: 0

      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          python-version: ${{ matrix.python-version }}
          enable-cache: true

      # What opencv dlopens (libgl1/libglib2.0-0) plus exactly what `ldd`
      # reports for PySide6's own platforms/libqoffscreen.so, minus the C/C++
      # runtime and what the wheel bundles itself. No xvfb: Qt's offscreen
      # platform plugin needs no display server at all.
      # NOT libxcb-cursor0: that one belongs to libqxcb.so -- the plugin the
      # desktop app picks (app.py's default_qpa_platform) and CI never loads.
      - name: Install system dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libgl1 libegl1 libglib2.0-0 libxkbcommon0 libdbus-1-3 \
            libfontconfig1 libx11-6 libxcb1

      # --locked (not bootstrap.py's --frozen): CI's job is exactly to catch
      # a uv.lock that's drifted from pyproject.toml, so it should fail loud
      # here rather than silently pass with a stale lock.
      - name: Sync dependencies
        id: sync
        run: uv sync --locked --python ${{ matrix.python-version }}

      # opencv-python's cp314 wheels aren't reliably published yet; a resolution
      # failure here is expected until they land, hence continue-on-error above
      # rather than a hard skip -- the matrix leg still reports what's true today.

      # Everything but the UI: one process, as it has always run.
      - name: Run tests
        run: uv run --locked --python ${{ matrix.python-version }} pytest -q --ignore=tests/unit/ui --junitxml=build/junit.xml

      # BOTH platforms run one pytest process per test module. Windows first:
      # its offscreen plugin took an access violation at the first real event
      # pump once mid-suite state accumulated. Linux kept a single process as
      # the cross-module canary — and that canary then segfaulted three
      # separate times at the same landmark test, each a runner-only crash
      # unreproducible on an identical local tree/Python (coverage tracer
      # once, allocation noise twice; see .claude/skills/qt-ui-debugging).
      # Process-per-module keeps FULL coverage — no skips — and turns an
      # environment-noise crash into a named module failure instead of a
      # suite kill. Cross-module interaction is still exercised: locally the
      # suite runs one-process (and has never crashed there), and the e2e
      # module drives whole journeys in one process. pwsh ships on both
      # runner images, so one step serves both. Revisit on PySide6 upgrades.
      #
      # Runs even when the step above failed (but not when the sync did, which
      # would only produce noise): a broken non-UI test must not hide the UI's
      # results, which is what the separate job it replaces used to guarantee.
      - name: Run the UI tests (process per module)
        if: ${{ !cancelled() && steps.sync.conclusion == 'success' }}
        shell: pwsh
        run: |
          $failed = @()
          Get-ChildItem tests/unit/ui/test_*.py | ForEach-Object {
            $junit = "build/junit-" + $_.BaseName + ".xml"
            uv run --locked --python ${{ matrix.python-version }} pytest $_.FullName -q --junitxml=$junit
            if ($LASTEXITCODE -ne 0) { $failed += $_.Name }
          }
          if ($failed.Count -gt 0) { Write-Error ("failing modules: " + ($failed -join ', ')); exit 1 }

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: junit-${{ matrix.os }}-py${{ matrix.python-version }}
          path: build/junit*.xml

  launcher-smoke:
    name: verify launcher bootstrap (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The version here is just what runs bootstrap.py itself -- bootstrap.py
      # provisions the app's actual interpreter separately via uv, per
      # .python-version. That decoupling is the whole point being tested.
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"

      # Lives here rather than in installer-smoke.yml: it tests this commit's
      # start.bat, so it must run whenever start.bat changes, and that workflow
      # is path-filtered to installer/**. It also needs no release, which is
      # what let the installer-smoke version of this check only pass once a
      # release already carried the fix.
      - name: start.bat interpreter probe (Windows)
        if: runner.os == 'Windows'
        shell: powershell
        run: .\installer\tests\Test-StartBatProbe.ps1

      # No system packages installed here, deliberately: pre-installing
      # libgl1/glib would test a runner that already has them, not
      # bootstrap.py's own detect-and-offer-to-install logic. No xvfb either --
      # the launch below runs Qt's offscreen platform plugin, so there is no
      # display server to provide.

      # The app has no headless flag, so a full run blocks on the Qt event
      # loop and the launcher never exits on its own. So wait for the line
      # bootstrap.py prints when it hands off to the app rather than for the
      # process: everything under test (uv install, dependency sync, the
      # Linux runtime-lib check) has happened by then, and the previous
      # fixed 60x5s loop could only ever end by exhausting all 300 seconds.
      # 300s stays, as a ceiling rather than a floor.
      #
      # Output is redirected and dumped afterward unconditionally, not just on
      # failure. This used to come back empty on every run; the cause was
      # bootstrap.py's stdout being block-buffered once redirected, so a
      # process killed mid-run never flushed a byte. Fixed at the source
      # (bootstrap.log's writer flushes), which is also what makes the poll
      # below possible at all.
      - name: Launch and wait (Linux)
        if: runner.os == 'Linux'
        shell: bash
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          timeout 300 ./start.sh --auto > bootstrap.log 2>&1 &
          LAUNCH_PID=$!
          READY=0
          for _ in $(seq 1 300); do
            if grep -q 'Starting the app' bootstrap.log 2>/dev/null; then
              READY=1
              break
            fi
            # The launcher exiting before that line means it failed; stop
            # waiting and let the dumped log below show why.
            kill -0 "$LAUNCH_PID" 2>/dev/null || break
            sleep 1
          done
          # Give the app a moment to initialize, so an immediate crash still
          # lands in the log rather than being killed before it can be printed.
          sleep 10
          kill "$LAUNCH_PID" 2>/dev/null || true
          wait "$LAUNCH_PID" 2>/dev/null || true
          echo "----- bootstrap.py output -----"
          cat bootstrap.log || true
          if [ "$READY" -ne 1 ]; then
            echo "::error::bootstrap.py never reached the app-launch step."
            exit 1
          fi

      # A PowerShell background Job, not Start-Process -RedirectStandardOutput:
      # the previous attempt at this (Start-Process -WindowStyle Hidden +
      # file-redirected output) completed in ~5 seconds with no output in
      # either redirect file and no clear error -- the combination is a known
      # flaky one for launching a .bat this way. Start-Job captures the
      # child's streams natively, no file redirection involved.
      #
      # Same reason as the Linux step for polling rather than waiting: the job
      # never completes on its own, so Wait-Job -Timeout 300 always waited the
      # full five minutes. -Keep leaves the output on the job so the dump
      # below still shows everything.
      - name: Launch and wait (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          $job = Start-Job -ScriptBlock {
            Set-Location $using:PWD
            & .\start.bat --auto 2>&1
          }
          $ready = $false
          foreach ($i in 1..300) {
            $sofar = Receive-Job -Job $job -Keep | Out-String
            if ($sofar -match 'Starting the app') { $ready = $true; break }
            if ($job.State -ne 'Running') { break }
            Start-Sleep -Seconds 1
          }
          # Let the app initialize, so an immediate crash still reaches the log.
          Start-Sleep -Seconds 10
          Write-Host "----- bootstrap.py output (job state: $($job.State)) -----"
          Receive-Job -Job $job -Keep
          Stop-Job -Job $job -ErrorAction SilentlyContinue
          Remove-Job -Job $job -Force -ErrorAction SilentlyContinue
          if (-not $ready) {
            Write-Host "::error::bootstrap.py never reached the app-launch step."
            exit 1
          }

      # The real assertion: not "a file exists" but "the resulting environment
      # actually works". Two separate checks, since `uv run` rejects
      # --frozen and --locked together: --check catches a uv.lock that has
      # drifted from pyproject.toml, and the import proves the environment
      # bootstrap.py actually built -- via `uv sync --frozen`, same as here
      # -- has the runtime pieces that matter (cv2 needs libGL/glib; PySide6
      # is the UI toolkit). Works identically on both platforms because
      # bootstrap.py's logic is now the same code either way.
      - name: Verify the resulting environment (Linux)
        if: runner.os == 'Linux'
        run: |
          test -x .uv/bin/uv || { echo "::error::bootstrap.py did not install uv"; exit 1; }
          .uv/bin/uv lock --check
          .uv/bin/uv run --frozen python -c "import cv2, PySide6; print('cv2 + PySide6 import OK')"

      - name: Verify the resulting environment (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          if (-not (Test-Path ".uv\bin\uv.exe")) {
            Write-Error "bootstrap.py did not install uv"
            exit 1
          }
          & .uv\bin\uv.exe lock --check
          & .uv\bin\uv.exe run --frozen python -c "import cv2, PySide6; print('cv2 + PySide6 import OK')"
