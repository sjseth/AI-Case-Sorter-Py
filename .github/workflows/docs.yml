name: Docs

# Publishes the MkDocs site (mkdocs.yml, docs/) to the `gh-pages` branch, one
# directory per release, with the version dropdown reading mike's versions.json.
#
# Deliberately NOT `on: release: published`, for the same reason
# installer-smoke.yml isn't: that event fires while the release is still a
# prerelease, before release.yml has decided whether it becomes `latest` at
# all. Publishing the docs off it would move the `latest` alias for every
# release candidate. So this is a `workflow_call` that release.yml makes at
# the point of promotion, plus a `workflow_dispatch` for re-publishing a
# version by hand.
#
# It always builds from the release's own tag, never from the branch that
# dispatched it -- the docs at version N have to be the docs that shipped in N.
on:
  # The unreleased docs, in one rolling `dev` slot (JL). Path-filtered: only a
  # change that reaches the site is worth a deploy.
  push:
    branches: [main]
    paths:
      - "docs/**"
      - "mkdocs.yml"
      - "mkdocs-pdf.yml"
      - ".github/workflows/docs.yml"

  workflow_call:
    inputs:
      version:
        description: "Release tag to publish the docs for. Must exist as a tag."
        required: true
        type: string

  workflow_dispatch:
    inputs:
      version:
        description: "Release tag to publish the docs for, e.g. 1.2.0 or 1.2.0rc1. Must exist as a tag."
        required: true
        type: string

# Never cancel: a cancelled run can leave gh-pages with a version directory
# deployed but versions.json not yet updated, which is the dropdown missing an
# entry that exists. Serialised instead, so two releases queue rather than race.
concurrency:
  group: docs-deploy
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    name: deploy versioned docs
    runs-on: ubuntu-latest
    permissions:
      # gh-pages is an ordinary branch; mike commits and pushes to it. This
      # does not use the Pages deployment API -- `pages: write` is only for
      # the one-time enablement call below.
      #
      # release.yml calls this workflow, and a caller's job permissions cap
      # what the called job may request -- asking for more is a parse error
      # that invalidates *release.yml*, not this file, and actionlint does not
      # flag it. Anything added here has to be added to release.yml's `docs`
      # job in the same change.
      contents: write
      pages: write
    steps:
      # persist-credentials left on (the default), unlike every other workflow
      # here: pushing to gh-pages is this job's entire purpose, and mike runs
      # `git push origin` itself.
      #
      # fetch-depth: 0 is load-bearing and not just "be thorough": it is the
      # only setting under which actions/checkout fetches
      # `+refs/heads/*:refs/remotes/origin/*` rather than the requested ref
      # alone, and origin/gh-pages is what mike reads the existing versions
      # from. At any other depth mike would find no branch, build a gh-pages
      # holding this version and nothing else, and the push would be rejected
      # as non-fast-forward -- loud, but only after the build.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 # zizmor: ignore[artipacked] mike's own `git push` to gh-pages is this job's entire purpose
        with:
          fetch-depth: 0
          # A push has no version input: the dev slot documents the commit
          # that triggered it, which is what `github.sha` already resolves to.
          ref: ${{ inputs.version || github.sha }}

      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0

      # --only-group docs: mkdocs and mike need nothing from the app itself, and
      # --no-install-project keeps hatch-vcs's build hook out of a job that has
      # no reason to run it.
      - name: Install the docs toolchain
        run: uv sync --locked --only-group docs --no-install-project

      # WeasyPrint (the PDF renderer behind mkdocs-with-pdf) links against
      # system pango; the runner image does not guarantee it. Cairo is no
      # longer needed (WeasyPrint >= 53 renders PDFs itself).
      - name: Install PDF system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libpango-1.0-0 libpangoft2-1.0-0 libharfbuzz-subset0

      - name: Configure git for mike's commits
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      # mike's own build is not strict, so a broken link or a dead anchor would
      # publish silently. Run the strict build first and fail before gh-pages is
      # touched at all -- the cost is one extra second, and the alternative is
      # noticing from the published site. Deliberately the PLAIN config: the
      # PDF plugin counts WeasyPrint's cosmetic CSS complaints as errors under
      # --strict even when the PDF renders fine, and links/anchors -- the
      # things strictness is for -- are identical in both configs.
      - name: Build the site strictly
        run: uv run --no-sync mkdocs build --strict

      # Three kinds, one output. The prerelease arm is the same expression
      # release.yml resolves `prerelease` from, so the two cannot disagree
      # about what a version string means; `dev` is decided by the event,
      # since a push carries no version at all.
      - name: Classify the deploy
        id: kind
        env:
          VERSION: ${{ inputs.version }}
          EVENT: ${{ github.event_name }}
        run: |
          if [ "$EVENT" = "push" ]; then
            echo "kind=dev" >> "$GITHUB_OUTPUT"
          elif echo "$VERSION" | grep -qE '(a|b|rc)[0-9]+$'; then
            echo "kind=prerelease" >> "$GITHUB_OUTPUT"
          else
            echo "kind=stable" >> "$GITHUB_OUTPUT"
          fi

      # Every push to main overwrites ONE rolling `dev` entry (JL) — the same
      # single-slot shape as `prerelease` below, so the dropdown carries one
      # unreleased entry rather than a directory per commit. It never takes
      # `latest` and never becomes the root, so an operator still lands on the
      # released docs.
      - name: Deploy the latest build into the rolling dev slot
        if: ${{ steps.kind.outputs.kind == 'dev' }}
        run: uv run --no-sync mike deploy -F mkdocs-pdf.yml --push --title "dev (unreleased)" dev

      # Release candidates share ONE rolling "prerelease" slot (JL): the
      # dropdown shows a single pre-release entry holding the newest
      # candidate's docs, instead of accumulating rc1/rc2/... forever. The
      # entry's title carries the actual tag; the URL is /prerelease/. It
      # never takes `latest`, so the docs root never lands on a candidate.
      - name: Deploy the release candidate into the rolling prerelease slot
        if: ${{ steps.kind.outputs.kind == 'prerelease' }}
        env:
          VERSION: ${{ inputs.version }}
        run: uv run --no-sync mike deploy -F mkdocs-pdf.yml --push --title "$VERSION (pre-release)" prerelease

      # --update-aliases is what moves `latest` off the previous release;
      # without it mike refuses to reassign an alias that already exists.
      - name: Deploy the release and move `latest`
        if: ${{ steps.kind.outputs.kind == 'stable' }}
        env:
          VERSION: ${{ inputs.version }}
        run: uv run --no-sync mike deploy -F mkdocs-pdf.yml --push --update-aliases "$VERSION" latest

      # Writes the redirect at the site root. Idempotent -- re-running it on an
      # already-correct gh-pages is a no-op commit at worst -- so it is simpler
      # to run it on every stable deploy than to detect the first one.
      - name: Point the site root at `latest`
        if: ${{ steps.kind.outputs.kind == 'stable' }}
        run: uv run --no-sync mike set-default -F mkdocs-pdf.yml --push latest

      # The same PDF the site serves, attached to the GitHub release (JL):
      # the manual lands next to the sdist, versioned by the release it
      # documents. Built fresh here because mike renders into gh-pages, not
      # site/. --clobber so a re-dispatched Docs run replaces rather than
      # fails; best-effort so a missing release (a bare tag) can't fail a
      # deploy that already succeeded.
      - name: Attach the PDF to the release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.version }}
        run: |
          uv run --no-sync mkdocs build -f mkdocs-pdf.yml
          cp site/pdf/ai-case-sorter-docs.pdf "ai-case-sorter-docs-${VERSION}.pdf"
          gh release upload "$VERSION" "ai-case-sorter-docs-${VERSION}.pdf" --clobber \
            || echo "::warning::No release named $VERSION to attach the PDF to."

      # The stable that ends an rc cycle supersedes the candidate's docs, so
      # the rolling slot is retired with it. `|| true`: most stables were
      # never preceded by a candidate and have nothing to delete.
      - name: Retire the prerelease slot
        if: ${{ steps.kind.outputs.kind == 'stable' }}
        run: uv run --no-sync mike delete -F mkdocs-pdf.yml --push prerelease || true

      # One-time enablement, automated: the Pages API 404s until gh-pages
      # exists, which is why it can't be done before the first deploy -- but
      # by this step the branch is pushed, so the call succeeds exactly once
      # and 409s ever after. Branch mode on purpose: the "GitHub Actions"
      # source expects whole-site artifact uploads and can't coexist with
      # mike's branch-rewriting model. Best-effort: if an org policy denies
      # the token, print the manual instruction instead of failing a deploy
      # that already succeeded.
      - name: Enable GitHub Pages on gh-pages (first run only)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh api "repos/${GITHUB_REPOSITORY}/pages" --silent 2>/dev/null; then
            echo "Pages already enabled."
          elif gh api -X POST "repos/${GITHUB_REPOSITORY}/pages" \
              -f 'source[branch]=gh-pages' -f 'source[path]=/' --silent; then
            echo "Pages enabled: gh-pages, root."
          else
            echo "::warning::Could not enable Pages via the API. One-time manual step:"
            echo "::warning::Settings -> Pages -> Deploy from a branch -> gh-pages, / (root)"
          fi

      - name: Summary
        if: always()
        env:
          VERSION: ${{ inputs.version }}
          KIND: ${{ steps.kind.outputs.kind }}
          REPO: ${{ github.repository }}
        run: |
          OWNER="${REPO%%/*}"
          NAME="${REPO##*/}"
          SITE="https://${OWNER}.github.io/${NAME}"
          {
            echo "### Documentation"
            echo ""
            case "$KIND" in
              dev)
                echo "- [\`dev\`](${SITE}/dev/) now holds the unreleased docs. \`latest\` and the site root are unchanged."
                ;;
              prerelease)
                echo "- Version: [\`$VERSION\`](${SITE}/prerelease/)"
                echo "- \`latest\` is unchanged -- a release candidate is reachable only from the version dropdown."
                ;;
              *)
                echo "- Version: [\`$VERSION\`](${SITE}/${VERSION}/)"
                echo "- [\`latest\`](${SITE}/latest/) now points at \`$VERSION\`, and so does the site root."
                ;;
            esac
          } >> "$GITHUB_STEP_SUMMARY"
