name: Verify Installer

# install-windows.ps1 is not part of the normal dev loop the way
# start.sh/start.bat are -- nobody runs it while iterating on the app, it is
# a one-shot onboarding script. It also needs a real published release to
# exercise its interesting path (sdist matching, tar.exe extraction); on a
# repo with none yet it would only ever hit the "no release, fall back to
# the source zip" branch. So this gets its own trigger rather than
# build.yml's blanket one: path-filtered on PR/push (fast feedback exactly
# when the script itself changes, near-zero cost otherwise), plus a
# workflow_call so release.yml can run it against the release it just cut.
#
# The workflow file is in its own path filter: without that, a PR editing
# only this file never runs the job it changes.
on:
  pull_request:
    paths:
      - "installer/**"
      - ".github/workflows/installer-smoke.yml"
  push:
    branches: [main]
    paths:
      - "installer/**"
      - ".github/workflows/installer-smoke.yml"

  # Called by release.yml, rather than triggering on release:published.
  #
  # Two reasons it cannot be a release trigger. The sdist this exercises is
  # attached by the release job, and release:published fires alongside that
  # upload -- the race lands on the "no matching asset, fall back to the source
  # archive" branch and fails on the missing _version.py, which is exactly what
  # happened on the 1.0.0 rename. And the release under test is a *prerelease*
  # at this point, which /releases/latest deliberately excludes, so the default
  # installer path would verify the previous release and pass while proving
  # nothing about this one.
  workflow_call:
    inputs:
      tag:
        description: "Release tag to verify. Omit to test whatever /releases/latest resolves to."
        required: false
        type: string

  # Manual runs, with the same optional pin. Useful when /releases/latest is not
  # the release you want to check -- including the case where it predates a
  # package rename and so carries an sdist the current installer cannot match.
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to verify. Omit to test whatever /releases/latest resolves to."
        required: false
        type: string

permissions:
  contents: read

jobs:
  installer-smoke:
    name: verify Windows installer
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        # One leg per way the installer can end up with a Python: already on
        # the machine, provisioned via winget, or downloaded from python.org.
        python-state: [preinstalled, winget, pythonorg]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Runs first, and needs no release: it feeds hostile entry names to the
      # validation directly. The install below only ever sees a legitimate
      # archive, so it can show the check doesn't reject good entries but
      # never that it rejects bad ones -- that half is only tested here.
      - name: Archive-entry validation
        shell: powershell
        run: .\installer\Test-ArchiveEntryValidation.ps1

      # -Repo $env:GITHUB_REPOSITORY, not the script's own hardcoded default:
      # makes this self-adapting to wherever it runs -- the fork's own real
      # releases today, whatever repo eventually hosts this upstream.
      #
      # shell: powershell (Windows PowerShell 5.1), not pwsh (PowerShell 7):
      # that is the interpreter a real double-click via install-windows.bat
      # actually uses, and the one the script's own top-of-file comment
      # calls out by name for its BOM/codepage decoding quirks -- pwsh would
      # not exercise that at all.
      #
      # Cheap up-front diagnosis. When this job fails it is usually not the
      # installer being broken but the release it resolved to not carrying an
      # sdist under the name the installer matches -- after a package rename
      # every release cut before it is in exactly that state, and the symptom
      # is an unhelpful "_version.py is missing" three steps later.
      - name: Show the release under test
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ inputs.tag }}
        run: |
          if [ -n "$TAG" ]; then
            ENDPOINT="releases/tags/$TAG"
          else
            ENDPOINT="releases/latest"
          fi
          echo "Resolving $ENDPOINT"
          gh api "repos/${GITHUB_REPOSITORY}/${ENDPOINT}" \
            --jq '"tag: \(.tag_name)   prerelease: \(.prerelease)", "assets:", (.assets[].name | "  - \(.)")' \
            || echo "::warning::No release at $ENDPOINT -- the installer will fall back to the source archive and this job will fail."

          # The lookup above is authenticated; the installer's is not, and a
          # runner's shared IP routinely exhausts the 60/hour anonymous budget.
          echo "Anonymous rate limit available to the installer:"
          curl -fsSL https://api.github.com/rate_limit \
            | jq -r '.resources.core | "  remaining: \(.remaining)/\(.limit)   resets: \(.reset | todate)"' \
            || echo "  (could not read rate_limit)"

      # winget/pythonorg strip every Python the installer's probe would find:
      # PATH surgery keeps WindowsApps (winget + the Store stub the probe
      # skips), and py.exe is moved aside so `py -3` fails too. pythonorg
      # additionally drops winget's own directory. The new PATH goes to
      # GITHUB_ENV because GITHUB_PATH can only append, never remove.
      - name: Simulate Python state (${{ matrix.python-state }})
        shell: powershell
        env:
          MODE: ${{ matrix.python-state }}
        run: |
          if ($env:MODE -eq 'preinstalled') {
            Write-Host "PATH left untouched; the installer should find the runner's own Python."
            exit 0
          }

          $dirs = ($env:PATH -split ';') | Where-Object {
            $_ -and ($_ -like '*\WindowsApps*' -or
                     -not (Test-Path -LiteralPath "$_\python.exe" -ErrorAction SilentlyContinue))
          }
          if (Test-Path 'C:\Windows\py.exe') {
            Move-Item 'C:\Windows\py.exe' 'C:\Windows\py.exe.moved' -Force
          }
          if ($env:MODE -eq 'pythonorg') {
            $wingetSrc = (Get-Command winget -CommandType Application -ErrorAction SilentlyContinue |
                          Select-Object -First 1).Source
            if ($wingetSrc) {
              $wingetDir = Split-Path $wingetSrc -Parent
              $dirs = $dirs | Where-Object { $_ -ne $wingetDir }
            }
          }
          $env:PATH = $dirs -join ';'
          "PATH=$env:PATH" | Out-File $env:GITHUB_ENV -Append -Encoding utf8

          # Prove the simulated state before trusting it.
          $badPython = Get-Command python -CommandType Application -ErrorAction SilentlyContinue |
                       Where-Object { $_.Source -notlike '*\WindowsApps\*' } |
                       Select-Object -First 1
          if ($badPython) {
            Write-Host "python still resolves outside WindowsApps: $($badPython.Source)"
            exit 1
          }
          if (Get-Command py -CommandType Application -ErrorAction SilentlyContinue) {
            Write-Host "py still resolves; the launcher was not removed."
            exit 1
          }
          if ($env:MODE -eq 'pythonorg' -and
              (Get-Command winget -CommandType Application -ErrorAction SilentlyContinue)) {
            Write-Host "winget still resolves in pythonorg mode."
            exit 1
          }
          Write-Host "Simulated '$env:MODE': no python, no py$(if ($env:MODE -eq 'pythonorg') { ', no winget' })."

      # -NoLaunch keeps *this* step scoped to install + extract. The full
      # bootstrap.py/uv-sync path is launcher-smoke's job; the one leg that
      # repeats it below does so only to prove start.bat's interpreter probe
      # survives a poisoned `python`, which launcher-smoke cannot stage.
      #
      # -Version pins the release under test when one is passed in. Without it
      # the script resolves /releases/latest, which is the wrong target twice
      # over during a release: the new release is still a prerelease and so
      # excluded from `latest`, and any concurrent release would decide what
      # gets tested. On the path/PR triggers no tag is passed and `latest` is
      # the right answer.
      - name: Run the installer for real
        shell: powershell
        env:
          TAG: ${{ inputs.tag }}
          MODE: ${{ matrix.python-state }}
        run: |
          # 6>&1 folds the installer's Write-Host output (information stream)
          # into the tee; a plain pipe would capture none of it. It also takes
          # that output away from the console host, so Start-Transcript's own
          # install-<stamp>.log is checked separately below rather than here.
          $out = Join-Path $env:RUNNER_TEMP 'installer-out.txt'
          # Not reset by a script that succeeds by falling off the end of its
          # try block, so it would otherwise carry whatever the last native
          # call inside the installer left behind.
          $LASTEXITCODE = 0
          if ($env:TAG) {
            Write-Host "Verifying release $env:TAG"
            .\installer\install-windows.ps1 -Repo $env:GITHUB_REPOSITORY -Version $env:TAG -NoLaunch 6>&1 |
              Tee-Object -FilePath $out
          } else {
            Write-Host "Verifying whatever /releases/latest resolves to"
            .\installer\install-windows.ps1 -Repo $env:GITHUB_REPOSITORY -NoLaunch 6>&1 |
              Tee-Object -FilePath $out
          }
          if ($LASTEXITCODE) { exit $LASTEXITCODE }

          # The exit code alone cannot show *which* provisioning path ran.
          #
          # Assert on the resolved interpreter, not on a banner: "Using winget"
          # prints before winget runs, and Install-Python calls
          # Update-PathFromRegistry first, which can hand the machine PATH's own
          # Python back and let the leg pass with winget having done nothing.
          # Match narrowly for the same reason -- a bare 'Found ' is satisfied
          # by "No published release found", and a bare 'falling back' also
          # matches the sdist fallback, which has nothing to do with Python.
          $provisioned = 'Installed .*\\Programs\\Python\\Python313\\python\.exe'
          $text = Get-Content $out -Raw
          $bad = @()
          switch ($env:MODE) {
            'preinstalled' {
              if ($text -notmatch 'Found .*python\.exe') { $bad += "expected 'Found <path>\python.exe' (pre-existing Python)" }
            }
            'winget' {
              if ($text -notmatch 'Using winget: Python\.Python\.3\.13') { $bad += "expected 'Using winget: Python.Python.3.13'" }
              if ($text -match 'falling back to python\.org') { $bad += "unexpected fallback to python.org" }
              if ($text -notmatch $provisioned) { $bad += "expected a freshly provisioned Python313 interpreter" }
            }
            'pythonorg' {
              if ($text -notmatch 'winget is not available; using python\.org\.') { $bad += "expected 'winget is not available; using python.org.'" }
              if ($text -notmatch 'Downloading https://www\.python\.org/ftp/') { $bad += "expected 'Downloading https://www.python.org/ftp/'" }
              if ($text -notmatch $provisioned) { $bad += "expected a freshly provisioned Python313 interpreter" }
            }
          }
          if ($bad) {
            Write-Host "----- installer output -----"
            Write-Host $text
            Write-Host "Installer took the wrong provisioning path for '$env:MODE': $($bad -join '; ')"
            exit 1
          }
          Write-Host "Provisioning path for '$env:MODE' confirmed."

          # 6>&1 above keeps Write-Host out of the console host, so the
          # transcript is thin -- but it must still exist and name this run.
          $installLog = Get-ChildItem "$env:LOCALAPPDATA\CaseSorter\logs\install-*.log" -ErrorAction SilentlyContinue |
                        Sort-Object LastWriteTime | Select-Object -Last 1
          if (-not $installLog) {
            Write-Error "No install-<stamp>.log under the data root -- Start-Transcript did not run."
            exit 1
          }
          Write-Host "Install transcript: $($installLog.FullName) ($($installLog.Length) bytes)"

      # The real assertion: not "the script exited 0" but "a working install
      # landed with the version the sdist actually carries" -- proves the
      # -Repo override, sdist asset-matching and tar.exe extraction all
      # worked against a real GitHub release, not a synthetic fixture.
      #
      # It does NOT prove the entry validation rejects anything: this archive
      # is legitimate, so all it shows is the check not firing on good input.
      # The rejection half is the earlier step's job.
      - name: Verify the install
        shell: powershell
        env:
          TAG: ${{ inputs.tag }}
        run: |
          $dest = "$env:LOCALAPPDATA\Programs\CaseSorter"
          if (-not (Test-Path "$dest\main.py")) {
            Write-Error "main.py is missing -- the app was not installed."
            exit 1
          }
          # Searched, not pinned: an untagged run installs /releases/latest,
          # whose layout is whatever that release shipped.
          $versionFile = Get-ChildItem -Path $dest -Filter _version.py -Recurse -File -ErrorAction SilentlyContinue |
                         Select-Object -First 1
          if (-not $versionFile) {
            Write-Error "_version.py is missing -- installed from the source archive, not the sdist."
            exit 1
          }
          $content = Get-Content $versionFile.FullName -Raw
          Write-Host "----- $($versionFile.FullName) -----"
          Write-Host $content
          if ($content -notmatch "__version__\s*=.*'([0-9][^']*)'") {
            Write-Error "$($versionFile.FullName) does not carry a real version."
            exit 1
          }
          $installed = $Matches[1]

          # When a tag was passed, "a real version" is not enough -- it has to
          # be *this* release. Anything else means the installer matched some
          # other release's asset, which is precisely the silent degradation
          # this job exists to catch.
          if ($env:TAG) {
            $expected = $env:TAG -replace '^v', ''
            if ($installed -ne $expected) {
              Write-Error "Installed version '$installed' is not the release under test ('$expected')."
              exit 1
            }
            Write-Host "Installed version matches the release under test: $installed"
          }
