# Configuration for actions/labeler -- see .github/workflows/labeler.yml
#
# Labels map to this repo's actual subsystem boundaries as CLAUDE.md describes
# them (UI vs. hardware I/O vs. control logic vs. persistence), not to generic
# folder names, so a label on a PR tells you which part of the app is in play.
# Since #58's `src/` layout gave each of those boundaries its own real
# subpackage, one directory glob per label is enough -- no more enumerated
# per-file lists to keep in sync as files move within a subsystem.
#
# NOTE: actions/labeler does not create labels -- every label named here must
# already exist in the repo or the action errors. They are declared in
# .github/settings.yml, which repository-settings/app applies for you; without
# that app they have to be created by hand.

ui:
  - changed-files:
      - any-glob-to-any-file: 'src/sorter/ui/**'

training:
  - changed-files:
      - any-glob-to-any-file:
          # sorter/ml/ holds local inference, evaluation, and classification --
          # all training-adjacent in the sense this label describes.
          - 'src/sorter/training/**'
          - 'src/sorter/ml/**'

hardware:
  - changed-files:
      - any-glob-to-any-file: 'src/sorter/hardware/**'

control:
  - changed-files:
      - any-glob-to-any-file: 'src/sorter/control/**'

data:
  - changed-files:
      - any-glob-to-any-file: 'src/sorter/data/**'

community:
  - changed-files:
      - any-glob-to-any-file: 'src/sorter/community/**'

updater:
  - changed-files:
      - any-glob-to-any-file:
          - 'src/sorter/update/**'
          - 'installer/**'

launcher:
  - changed-files:
      - any-glob-to-any-file:
          - 'bootstrap.py'
          - 'start.sh'
          - 'start.bat'

tests:
  - changed-files:
      - any-glob-to-any-file: 'tests/**'

ci:
  - changed-files:
      - any-glob-to-any-file: '.github/**'

documentation:
  - changed-files:
      - any-glob-to-any-file: '**/*.md'

dependencies:
  - changed-files:
      - any-glob-to-any-file:
          - 'pyproject.toml'
          - 'uv.lock'
  - head-branch: ['^renovate/', '^dependabot/']

# Deliberately loud, and the only label here that is a warning rather than a
# classification. Merging a PR that touches this file does not just change a
# file: the Settings app applies it to the live repository. Some of what it can
# change is invisible in a diff of it -- merge methods, branch protection, who
# is allowed to approve a deployment.
"⚠️ REPO SETTINGS":
  - changed-files:
      - any-glob-to-any-file: '.github/settings.yml'
