# Repository settings as code.
#
# Read by either of two GitHub Apps -- neither is installed by default, and
# **this file does nothing until one is**:
#
#   * repository-settings/app ("Settings")  -- per-repo, works on a personal
#     repo, reads exactly this path. https://github.com/repository-settings/app
#   * github/safe-settings                  -- org-scale successor, reads from
#     an admin repo and needs a GitHub App + an org.
#     https://github.com/github/safe-settings
#
# Kept here regardless, for two reasons: it makes settings drift a reviewable
# change rather than something someone silently clicked; and if an app is ever
# installed, it applies without being rewritten first.
#
# Without an app installed, this file is documentation -- every setting below
# has to be applied by hand through the GitHub UI.
#
# THIS FILE IS IN repository-settings/app FORMAT, not safe-settings format --
# they look similar but are not interchangeable. Verified against
# reqstool/.github-private/safe-settings/settings.yml; two concrete differences
# if this ever moves to safe-settings (which would also mean moving the file
# into an admin repo, since safe-settings reads from there, not from here):
#
#   1. labels: safe-settings nests them under `labels: { include: [...] }`
#      (and supports `exclude:`); this format takes a flat `labels: [...]`.
#   2. security: safe-settings has a `repository.security` block with
#      `enableVulnerabilityAlerts` / `enableAutomatedSecurityFixes`. There is
#      no equivalent here, so those two stay manual. The wanted state is
#      alerts ON, automated fixes OFF: Renovate owns dependency PRs here, and
#      running both bots opens duplicate PRs for the same CVE.

repository:
  has_issues: true
  has_wiki: false
  has_projects: false
  # Off: the project's user community is the Discord, not a GitHub tab, and a
  # second half-used venue only splits the audience and leaves questions
  # unanswered. Support questions route to Discord via the issue-form contact
  # link; this repo's Issues stay for bugs and features.
  has_discussions: false

  # Squash-only. Merge commits and rebase both produce histories that break the
  # one assumption everything else here depends on: that each commit on main is
  # a Conventional Commits subject git-cliff can derive a version from.
  allow_squash_merge: true
  allow_merge_commit: false
  allow_rebase_merge: false

  # PR_TITLE, not COMMIT_OR_PR_TITLE (GitHub's default). The default uses the
  # commit subject when a PR has exactly one commit -- so a PR whose title was
  # checked by check-semantic-pr.yml can still land with an unchecked subject
  # line. PR_TITLE means the thing that was validated is the thing that lands.
  squash_merge_commit_title: PR_TITLE
  squash_merge_commit_message: COMMIT_MESSAGES

  delete_branch_on_merge: true
  allow_auto_merge: true
  allow_update_branch: true

# Referenced by .github/labeler.yml, which auto-applies them by changed path.
# actions/labeler does NOT create labels -- it errors on any that don't exist,
# so these have to be created before that workflow can work.
labels:
  # Subsystem labels, mapped to CLAUDE.md's architecture boundaries.
  - name: ui
    color: "1d76db"
    description: "Tkinter UI: tabs, dialogs, theme"
  - name: training
    color: "6f42c1"
    description: "Model training, local inference, evaluation"
  - name: hardware
    color: "b60205"
    description: "Serial board, camera, image processing"
  - name: community
    color: "0e8a16"
    description: "Community backend, auth, feedback loop"
  - name: updater
    color: "fbca04"
    description: "In-app updater and the Windows installer"
  - name: launcher
    color: "d4c5f9"
    description: "bootstrap.py and the start.sh/start.bat shims"
  - name: tests
    color: "c2e0c6"
    description: "Test suite"
  - name: ci
    color: "000000"
    description: "CI/CD workflows and repo tooling"
  - name: dependencies
    color: "0366d6"
    description: "Dependency updates"

  # Applied by the issue templates (.github/ISSUE_TEMPLATE/*.yml), which set it
  # on every new issue. Same trap as the Renovate labels below: GitHub issue
  # forms silently drop a label that doesn't exist, so without this entry the
  # templates' `labels: [..., "triage"]` was doing nothing at all.
  - name: triage
    color: "ededed"
    description: "New issue awaiting triage"

  # Applied by Renovate itself (.github/renovate.json5), not by labeler.yml.
  # These were referenced by that config but had never been created -- Renovate
  # does not create labels it references, so every one of them was silently
  # doing nothing.
  - name: bot-renovate
    color: "5319e7"
    description: "Opened by Renovate"
  - name: bot-renovate-stop
    color: "5d0811"
    description: "Renovate: stop updating this PR (add it yourself to pin a PR)"
  - name: bot-renovate-rebase
    color: "7057ff"
    description: "Renovate: recreate this PR's branch on the next run (consumed and removed by Renovate)"
  - name: security
    color: "b60205"
    description: "Vulnerability alert / security update"
  - name: needs-hardware-test
    color: "e99695"
    description: "torch/torchvision bump -- verify on real CUDA hardware before merging"
  - name: renovate-version-major
    color: "d73a4a"
    description: "Major version update (breaking risk; never auto-merged)"
  - name: renovate-version-minor
    color: "fbca04"
    description: "Minor version update"
  - name: renovate-version-patch
    color: "0e8a16"
    description: "Patch version update"
  - name: renovate-version-digest
    color: "c5def5"
    description: "Digest/SHA pin update (never auto-merged)"

  # GitHub's defaults, restated so this file is the whole picture rather than a
  # diff against whatever a repo happened to start with.
  - name: bug
    color: "d73a4a"
    description: "Something isn't working"
  - name: documentation
    color: "0075ca"
    description: "Improvements or additions to documentation"
  - name: enhancement
    color: "a2eeef"
    description: "New feature or request"
  - name: "good first issue"
    color: "7057ff"
    description: "Good for newcomers"
  - name: "help wanted"
    color: "008672"
    description: "Extra attention is needed"
  - name: question
    color: "d876e3"
    description: "Further information is requested"

  # Applied by labeler.yml on any PR touching .github/settings.yml. Merging one
  # of those does not just change a file -- the Settings app applies it to the
  # live repo, including things no diff makes obvious (merge methods, branch
  # protection, who can approve a deployment). Loud on purpose.
  - name: "⚠️ REPO SETTINGS"
    color: "b60205"
    description: "⚠️ Changes .github/settings.yml -- merging APPLIES it to the live repository"

# Deployment environments, referenced by .github/workflows/publish.yml.
#
# `stable` is the PyPI publish, and it is the one irreversible step in the whole
# release: a version can be yanked but never replaced. The reviewer requirement
# is the in-flow confirmation before that happens -- the job sits pending until
# somebody approves it.
#
# Free on public repos; protection rules only cost money on private ones.
#
# Both gated by the same reviewer, so a release takes two approvals: one before
# the TestPyPI rehearsal, one before the PyPI publish. Nothing reaches an index
# without a human saying so.
#
# No deployment_branch_policy on purpose. `protected_branches: true` restricts
# deployments to protected branches, and these jobs run on `release` events
# where the ref is a tag rather than a branch -- it would block every
# deployment.
environments:
  # TestPyPI, the rehearsal.
  - name: test
    reviewers:
      - id: 3073671 # sjseth
        type: User

  - name: stable
    reviewers:
      - id: 3073671 # sjseth
        type: User
