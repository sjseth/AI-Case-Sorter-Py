[changelog]
header = ""
# `striptags` strips the `<!-- N -->` sort prefixes below -- without them,
# groups sort alphabetically and Security/Features end up buried after Bug
# Fixes. `commit.breaking` marks a `feat!:` so it doesn't render identically
# to an ordinary `feat:`.
#
# `remote.pr_number` (the `in #N` above) only resolves for a squash merge --
# git-cliff matches a commit's SHA against a closed PR's merge_commit_sha,
# never true for a real merge commit's constituent commits. The `replace`
# strips GitHub's own auto-appended " (#N)" from a squashed title first, using
# this exact pr_number so it can't touch an unrelated "(#N)" elsewhere.
body = """
{% for group, commits in commits | group_by(attribute="group") %}\
### {{ group | striptags | trim | upper_first }}
{% for commit in commits %}\
- {% if commit.breaking %}**BREAKING** {% endif %}{% if commit.remote.pr_number %}{{ commit.message | replace(from=" (#" ~ commit.remote.pr_number ~ ")", to="") | upper_first }}{% else %}{{ commit.message | upper_first }}{% endif %}{% if commit.remote.username %} by @{{ commit.remote.username }}{% endif %}{% if commit.remote.pr_number %} in #{{ commit.remote.pr_number }}{% endif %}
{% endfor %}
{% endfor %}\
"""
trim = true
footer = ""

[git]
conventional_commits = true
filter_unconventional = true

# Security first, not alphabetical: "is there a fix I need" outranks "what's
# new" for an app with an auto-updater and a community backend.
commit_parsers = [
  { message = "^security", group = "<!-- 0 -->Security" },
  { message = "^feat", group = "<!-- 1 -->Features" },
  { message = "^fix", group = "<!-- 2 -->Bug Fixes" },
  { message = "^perf", group = "<!-- 3 -->Performance" },
  { message = "^refactor", group = "<!-- 4 -->Refactoring" },
  { message = "^docs", group = "<!-- 5 -->Documentation" },
  { message = "^test", group = "<!-- 6 -->Testing" },
  { message = "^style", group = "<!-- 7 -->Style" },
  { message = "^revert", group = "<!-- 8 -->Reverts" },
  { message = "^chore", group = "<!-- 9 -->Miscellaneous" },
  # ci/build are for maintainers, not users running the app -- skipped from
  # release notes. protect_breaking_commits below overrides this for `!:`.
  { message = "^ci", group = "CI/CD", skip = true },
  { message = "^build", group = "Build", skip = true },
]

# `build!: require Python 3.12` must reach users despite the skip above --
# without this, an upgrade that breaks their install ships with no warning.
protect_breaking_commits = true

filter_commits = false
# PEP 440, no `v` prefix -- see RELEASING.md. Anchored at both ends, and each
# anchor earns its place:
#
# `^` -- unanchored, the obvious "[0-9].*" also matches a stray `v1.0.0` tag
# (which check-release.yml rejects), silently making it a release boundary.
#
# `$` -- without it a release candidate (`0.5.0rc1`) is a boundary too, so the
# final `0.5.0`'s notes would start at the rc and omit everything the rc was
# cut to test, and --bumped-version would be computed relative to it. Release
# candidates are deliberately invisible here: they carry the same notes as the
# release they precede, spanning back to the last *stable* tag.
tag_pattern = "^[0-9]+\\.[0-9]+\\.[0-9]+$"
sort_commits = "newest"

[bump]
# Defaults true, which sends a single `type!:` at 0.x straight to 1.0.0 --
# an ordinary pre-1.0 breaking change declaring the API stable by accident.
# False keeps it at the minor instead (0.1.0 + `feat!:` -> 0.2.0); 1.0.0+ is
# unaffected. Reaching 1.0.0 needs `version` passed explicitly to Release.
# Pinned in tests/test_cliff_config.py.
breaking_always_bump_major = false
